name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntakssjekk av alle moduler
        run: for f in src/*.js; do node --check "$f"; done
      - name: Importsjekk og await-sjekk
        run: python3 tools/check_imports.py
      - name: dist er i takt med src
        run: python3 tools/build.py && git diff --exit-code custom_components/deckify/www
      - name: Ingen private verdier i arkivet
        run: |
          # deploy-verten og HA-øyeblikksbildet skal aldri havne i git
          ! git ls-files | grep -q 'tools/deploy.env'
          ! git ls-files | grep -q 'snapshot.json'
          ! git grep -nE '(hassio@|root@)[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' -- . ':!*.md'
      - name: Bildene README peker på finnes
        run: |
          grep -o 'docs/[a-z0-9-]*\.png' README.md | sort -u | while read -r f; do
            test -f "$f" || { echo "mangler $f"; exit 1; }
          done
